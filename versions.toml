# SPDX-License-Identifier: Apache-2.0
# The one place the build versions are written down. Every other file in this repository, and the
# checker's verdict on a consuming repository, is derived from or compared against these values.
# Change a value here, then run `scripts/check.py --self` (the templates must agree) and
# `scripts/sync-org-vars.sh` (the CI organisation variables must agree).

schema = 1

[rust]
# rustc for CI, release builds and local builds. rust-toolchain.toml in each repository and every
# `dtolnay/rust-toolchain@<version>` step must name exactly this.
toolchain = "1.100.0"
# Components every repository installs. A repository may add more (rustfmt, for one that checks
# formatting); components are tools and cannot change what is built.
components = ["clippy"]

[cxx]
# C++ language standard for every C++ translation unit we compile (Bazel cxxopt, CMake, cc shims).
# Abseil is built inside each library and must share its consumers' standard.
standard = "c++20"
# Optimisation level for C/C++ we compile; the reference builds its C++ at -O3 too.
opt_level = "O3"
# Floating-point contraction. `off` keeps a*b+c as two roundings on every target (see README).
fp_contract = "off"
# Flags that may never reach a C/C++ compile we run: each can change a computed value.
forbidden_flags = [
  "-march=", "-mcpu=", "-ffast-math", "-Ofast", "-funsafe-math-optimizations",
  "-ffp-model=fast", "-fassociative-math", "-freciprocal-math", "-ffp-contract=fast",
  "-ffp-contract=on",
]

[bazel]
# .bazelversion in each Bazel-built library, and the bazelisk release CI downloads.
version = "9.1.1"
bazelisk = "1.25.0"

[macos]
# Oldest macOS our native libraries are built to run on (Bazel --macos_minimum_os,
# CMake CMAKE_OSX_DEPLOYMENT_TARGET). Equal to the only macOS runner we build and test on, so no
# shipped binary claims support for a release nothing has run it on. (Was 13.3 until 2026-11-16.)
minimum = "15.0"
# Whether a CMake library must set CMAKE_OSX_DEPLOYMENT_TARGET (a CMakeLists.txt that sets it
# must agree with `minimum` either way).
cmake_target_required = true

[cargo]
# Packages whose binaries we ship as release bundles. Only these may add the keys below to the
# canonical [profile.release]; every other package keeps exactly cargo/profile-release.toml, so
# engine binaries built for development and gates keep their symbols.
shipped = ["vyges-suite", "vyges-sdc", "vyges-remap", "vyges"]

[cargo.allowed_profiles]
# Profiles other than release that a package may define, each exactly as written here. `dist` is
# the profile cargo-dist builds release artifacts with; it must add nothing to release.
dist = { inherits = "release" }

[cargo.shipped_profile_extra]
# Strip symbols from shipped binaries only (smaller downloads). Cannot change a computed value.
strip = true

[ci]
# GitHub-hosted runner OS versions. Workflows never name these directly: they read the
# organisation variables below, with this value as the fallback, e.g.
#   runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
#   runs-on: macos-${{ vars.VYGES_MACOS_VERSION || '15' }}
ubuntu = "24.04"
macos = "15"
ubuntu_var = "VYGES_UBUNTU_VERSION"
macos_var = "VYGES_MACOS_VERSION"
# Organisations whose variables scripts/sync-org-vars.sh keeps equal to the values above. Further
# organisations (for example private ones) are passed at run time in VYGES_EXTRA_ORGS.
orgs = ["vyges-tools", "vyges", "vyges-ip"]

[ci.test_profile_override]
# A CI `cargo test --release` step may trade the shipped profile for build time with these exact
# environment values. Release and bundle steps keep the shipped profile (no override).
CARGO_PROFILE_RELEASE_LTO = "false"
CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16"

[mimalloc]
# Global allocator of our binaries (never a library default). Pinned exactly: libmimalloc-sys
# 0.1.44 bundles mimalloc v2; later releases default to v3.
mimalloc = "0.1.48"
libmimalloc-sys = "0.1.44"

# Repositories deliberately NOT brought in line, each with its reason. The checker is not run on
# them in CI; listed so a sweep does not "fix" them by accident. Remove an entry when its repo is
# brought in line.
[[exemption]]
repo = "vyges/programmable-adc"
since = "2026-11-16"
reason = "Runs on ubuntu-22.04 on purpose: its setup job installs the KLayout ubuntu22_04 .deb. Left as is until the repo is reworked."

[[exemption]]
repo = "vyges/vyges-ip-template"
since = "2026-11-16"
reason = "Deprecated; hard-coded ubuntu-24.04 runner left as is."
